<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Nation Republic | Laying the Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07090e;
      --bg-surface: #0f131c;
      --bg-elevated: #151b26;
      --border-subtle: #222b3d;
      --gold: #c5a059;
      --gold-soft: rgba(197, 160, 89, 0.14);
      --gold-border: rgba(197, 160, 89, 0.35);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 0%, #151c2c 0%, var(--bg-deep) 65%);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      max-width: 1040px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* Hero Header */
    header {
      text-align: center;
      padding: 40px 0 56px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--gold-border);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
      margin-bottom: 32px;
      display: block;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      padding: 6px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-primary);
      margin-bottom: 16px;
    }

    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 640px;
      margin: 0 auto 32px;
      font-weight: 400;
    }

    .cta-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-block;
      background: var(--gold);
      color: #07090e;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: #d8b56c;
      transform: translateY(-2px);
    }

    .btn-secondary {
      display: inline-block;
      background: var(--bg-surface);
      color: var(--gold);
      border: 1px solid var(--gold);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--gold-soft);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(197, 160, 89, 0.15);
    }

    /* Section Headings */
    .section-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--gold);
      margin-bottom: 10px;
      display: block;
    }

    h2 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      letter-spacing: 0.04em;
      color: var(--text-primary);
      margin-bottom: 24px;
    }

    /* Foundation Block */
    .foundation-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-top: 3px solid var(--gold);
      border-radius: 10px;
      padding: clamp(28px, 5vw, 48px);
      margin-bottom: 64px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .foundation-card p {
      color: var(--text-secondary);
      font-size: 1.06rem;
      margin-bottom: 20px;
    }

    .foundation-callout {
      margin-top: 30px;
      padding: 22px 26px;
      background: var(--bg-elevated);
      border-left: 3px solid var(--gold);
      border-radius: 0 8px 8px 0;
    }

    .foundation-callout p {
      color: var(--text-primary);
      font-weight: 500;
      font-size: 1.08rem;
      margin-bottom: 8px;
    }

    .foundation-callout .pillars {
      color: var(--gold);
      font-family: 'Cinzel', Georgia, serif;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      margin-bottom: 0;
    }

    /* Mission & Vision Layout */
    .mv-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      margin-bottom: 64px;
    }

    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: clamp(28px, 4vw, 40px);
    }

    .panel p {
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    .vision-intro {
      margin-bottom: 20px;
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    .vision-list {
      list-style: none;
      display: grid;
      gap: 14px;
    }

    .vision-list li {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      padding: 16px 20px;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 0.98rem;
    }

    .vision-list li::before {
      content: "◆";
      color: var(--gold);
      font-size: 0.85rem;
      margin-top: 2px;
      flex-shrink: 0;
    }

    /* Principles Grid */
    .principles-section {
      margin-bottom: 64px;
    }

    .principles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 24px;
      margin-top: 28px;
    }

    .principle-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 28px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .principle-card:hover {
      border-color: var(--gold-border);
      transform: translateY(-2px);
    }
