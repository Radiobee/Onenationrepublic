<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Nation Republic | Laying the Foundation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #000000;
      --bg-surface: rgba(10, 14, 22, 0.82);
      --bg-elevated: rgba(18, 25, 38, 0.94);
      --border-subtle: rgba(212, 175, 55, 0.18);
      --gold: #d4af37;
      --gold-bright: #f9e29c;
      --gold-deep: #99741f;
      --gold-soft: rgba(212, 175, 55, 0.12);
      --gold-border: rgba(212, 175, 55, 0.45);
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--gold);
      color: #000000;
    }

    /* Custom Gold Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #020305;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--gold-deep), var(--gold), var(--gold-deep));
      border-radius: 4px;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* Pure Black & Stars Dynamic Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, rgba(10, 15, 28, 0.4) 35%, #000000 75%);
      overflow: hidden;
    }

    .stars, .stars2, .stars3 {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 200%;
      display: block;
    }

    .stars {
      background-image: radial-gradient(1px 1px at 25px 50px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 50px 100px, #d4af37, rgba(0,0,0,0)),
                        radial-gradient(2px 2px at 150px 150px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 250px 250px;
      opacity: 0.45;
      animation: driftStars 90s linear infinite;
    }

    .stars2 {
      background-image: radial-gradient(1.5px 1.5px at 80px 120px, #d4af37, rgba(0,0,0,0)),
                        radial-gradient(1px 1px at 200px 80px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 350px 350px;
      opacity: 0.65;
      animation: driftStars 140s linear infinite;
    }

    .stars3 {
      background-image: radial-gradient(2px 2px at 50px 200px, #ffffff, rgba(0,0,0,0)),
                        radial-gradient(1.5px 1.5px at 250px 250px, #d4af37, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 450px 450px;
      opacity: 0.35;
      animation: driftStars 200s linear infinite;
    }

    @keyframes driftStars {
      from { transform: translateY(0px); }
      to { transform: translateY(-50%); }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes pulseHalo {
      0%, 100% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.22), inset 0 0 20px rgba(212, 175, 55, 0.15); }
      50% { box-shadow: 0 0 65px rgba(212, 175, 55, 0.45), inset 0 0 30px rgba(212, 175, 55, 0.25); }
    }

    @keyframes goldShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .wrapper {
      max-width: 1040px;
      margin: 0 auto;
      padding: 64px 24px 90px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Hero Header */
    header {
      text-align: center;
      padding: 40px 0 64px;
      margin-bottom: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Tapered Golden Bottom Divider on Header */
    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 10%;
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--gold-border) 25%, var(--gold-bright) 50%, var(--gold-border) 75%, transparent 100%);
    }

    .logo-frame {
      position: relative;
      padding: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold-deep) 50%, var(--gold) 100%);
      animation: pulseHalo 5s ease-in-out infinite;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer Rotating Astrolabe Ring */
    .logo-frame::before {
      content: "";
