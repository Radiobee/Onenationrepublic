<!-- Black Swan Academia - Direct Consultation Intake -->
<form action="https://formsubmit.co/onrbsaconsultations@gmail.com" method="POST">
  
  <!-- System Routing & Todd-Proof Insurance Policy -->
  <input type="hidden" name="_subject" value="New BSA Consultation Request - Swan">
  <input type="hidden" name="_cc" value="Onenationtroubleshooting@gmail.com">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">

  <!-- Client Contact Details -->
  <div class="form-group">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="Client_Name" placeholder="Enter your full name" required>
  </div>

  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" name="Client_Email" placeholder="Enter your email address" required>
  </div>

  <div class="form-group">
    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="Client_Phone" placeholder="(555) 000-0000" required>
  </div>

  <!-- Automated Service Routing (Replaces Todd's Manual Gatekeeping) -->
  <div class="form-group">
    <label for="service">Select Consultation Service (Swan / BSA)</label>
    <select id="service" name="Requested_Service" required>
      <option value="" disabled selected>-- Select the specific service needed --</option>
      <!-- Drop Todd's list of Swan's services right here -->
      <option value="General BSA Consultation">General BSA Strategy Consultation</option>
      <option value="Litigation & Risk Analysis">Litigation & Administrative Risk Review</option>
      <option value="Private Trust & Estate Structure">Private Trust & Estate Structure Inquiry</option>
      <option value="Seminar Follow-Up">Black Swan Seminar Follow-Up</option>
    </select>
  </div>

  <!-- Intake Summary -->
  <div class="form-group">
    <label for="details">Brief Summary of Your Situation</label>
    <textarea id="details" name="Case_Summary" rows="5" placeholder="Provide the core details so Swan has everything needed prior to the call..." required></textarea>
  </div>

  <button type="submit">Submit Consultation Request</button>
</form>
