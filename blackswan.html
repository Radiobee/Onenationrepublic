<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Swan Academia | Consultation Intake</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-glow: rgba(212, 175, 55, 0.35);
      --bg-deep: #05070d;
      --card-bg: rgba(12, 16, 28, 0.88);
      --text-main: #f0f4f8;
      --text-muted: #a0aec0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Celestial Starfield Background */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-image: 
        radial-gradient(1.5px 1.5px at 25px 35px, #ffffff, transparent),
        radial-gradient(1px 1px at 80px 120px, var(--gold-light), transparent),
        radial-gradient(1.5px 1.5px at 150px 60px, #ffffff, transparent),
        radial-gradient(2px 2px at 220px 190px, var(--gold), transparent),
        radial-gradient(1px 1px at 290px 90px, #ffffff, transparent),
        radial-gradient(1.5px 1.5px at 350px 240px, var(--gold-light), transparent);
      background-size: 400px 300px;
      animation: starDrift 90s linear infinite;
      opacity: 0.55;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, rgba(212, 175, 55, 0.12) 0%, rgba(5, 7, 13, 0.92) 75%);
      z-index: -1;
    }

    @keyframes starDrift {
      from { transform: translateY(0); }
      to { transform: translateY(-300px); }
    }

    /* Main Gold-Accented Container */
    .intake-card {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 0 35px var(--gold-glow), inset 0 0 15px rgba(212, 175, 55, 0.08);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    /* Top BSA Logo */
    .logo-wrapper {
      margin-bottom: 20px;
    }

    .logo-wrapper img {
      max-width: 150px;
      height: auto;
      border-radius: 50%;
      border: 2px solid var(--gold);
      box-shadow: 0 0 22px var(--gold-glow);
    }

    h1 {
      font-size: 1.7rem;
      color: var(--gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    form {
      text-align: left;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--gold-light);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 13px 15px;
      background: rgba(5, 7, 13, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 12px var(--gold-glow);
    }

    select option {
      background-color: #0c101c;
      color: var(--text-main);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 8px;
      background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #f3e5ab 100%);
      color: #05070d;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 18px var(--gold-glow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(212, 175, 55, 0.6);
    }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--gold-light);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: var(--gold);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="intake-card">
    <!-- Top Graphic: BSA.avif -->
    <div class="logo-wrapper">
      <img src="BSA.avif" alt="Black Swan Academia Emblem">
    </div>

    <h1>Black Swan Academia</h1>
    <p class="subtitle">Direct Consultation &amp; Strategy Intake Request</p>

    <!-- Routed to Todd's corrected BSA inbox + CC'd to your Troubleshooting inbox -->
    <form action="https://formsubmit.co/onrbsaconsultations@gmail.com" method="POST">
      
      <!-- System Routing & Audit Trail -->
      <input type="hidden" name="_subject" value="New BSA Consultation Request - Swan">
      <input type="hidden" name="_cc" value="Onenationtroubleshooting@gmail.com">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="Client_Name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="Client_Email" placeholder="Enter your email address" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="Client_Phone" placeholder="(555) 000-0000" required>
      </div>

      <!-- Automated Service Selector (Strictly BSA / Swan) -->
      <div class="form-group">
        <label for="service">Select Consultation Focus</label>
        <select id="service" name="Requested_Service" required>
          <option value="" disabled selected>-- Select the specific service needed --</option>
          <option value="General BSA Strategy Consultation">General BSA Strategy Consultation</option>
          <option value="Litigation & Administrative Risk Review">Litigation &amp; Administrative Risk Review</option>
          <option value="Private Trust & Estate Structure Inquiry">Private Trust &amp; Estate Structure Inquiry</option>
          <option value="Black Swan Seminar Follow-Up">Black Swan Seminar Follow-Up</option>
        </select>
      </div>

      <div class="form-group">
        <label for="details">Brief Summary of Your Situation</label>
        <textarea id="details" name="Case_Summary" rows="5" placeholder="Provide the core details so Swan has everything needed prior to the call..." required></textarea>
      </div>

      <button type="submit" class="submit-btn">Submit Consultation Request</button>
    </form>

    <a href="links.html" class="back-link">&larr; Return to Main Hub</a>
  </div>

</body>
</html>
