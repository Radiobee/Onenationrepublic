<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Book of Johnson | One Nation Republic Official Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #07090e;
      --bg-surface: #0f131c;
      --bg-elevated: #151b26;
      --border-subtle: #222b3d;
      --gold: #c5a059;
      --gold-soft: rgba(197, 160, 89, 0.14);
      --gold-border: rgba(197, 160, 89, 0.35);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      background-image: radial-gradient(circle at 50% 0%, #151c2c 0%, var(--bg-deep) 65%);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      padding: 48px 20px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .hub-container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    /* Profile Header */
    .header-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--gold-border);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
      margin-bottom: 24px;
      display: block;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      padding: 5px 14px;
      border-radius: 4px;
      margin-bottom: 14px;
    }

    h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .bio {
      font-size: 0.98rem;
      color: var(--text-secondary);
      max-width: 520px;
      margin: 0 auto 24px;
    }

    /* Social Bar */
    .social-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .social-pill {
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--gold);
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      padding: 8px 18px;
      border-radius: 999px;
      transition: all 0.2s ease;
    }

    .social-pill:hover {
      background: var(--gold);
      color: #07090e;
      transform: translateY(-2px);
    }
